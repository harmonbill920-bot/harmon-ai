<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harmon Football Prediction</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="brand-mark">H</div><div><div class="brand-name">Harmon Football Prediction</div><div class="brand-sub">Football prediction</div></div></div>
  <button class="icon-btn" onclick="toggleSearch()">⌕</button>
</header>

<main>
  <div id="searchWrap" class="search-wrap hidden">
    <input id="searchInput" placeholder="Search team e.g. Simba, Yanga, Arsenal..." autocomplete="off">
    <button onclick="clearSearch()">×</button>
    <div id="searchResults" class="search-results"></div>
  </div>

  <div class="tabs">
    <button data-day="-1" onclick="loadDay(-1)">Yesterday</button>
    <button data-day="0" class="active" onclick="loadDay(0)">Today</button>
    <button data-day="1" onclick="loadDay(1)">Tomorrow</button>
  </div>

  <section class="heading">
    <div>
      <h1 id="pageTitle">Today's Matches</h1>
      <p>Country → League → Matches • prediction ready</p>
    </div>
    <span id="count" class="count">Loading...</span>
  </section>

  <div id="notice"></div>
  <div id="matches"><div class="loader">Loading matches...</div></div>
</main>

<nav class="bottom">
  <button class="selected" onclick="nav('Matches')">⚽<span>Matches</span></button>
  <button onclick="nav('Predictions')">♟<span>Predictions</span></button>
  <button onclick="nav('Leagues')">🏆<span>Leagues</span></button>
  <button onclick="nav('Favorites')">☆<span>Favorites</span></button>
  <button onclick="nav('More')">☰<span>More</span></button>
</nav>
</div>

<div id="modalRoot"></div>
<script>
let allMatches=[], currentDay=0, searchTimer=null;
const flags={Tanzania:"🇹🇿",Germany:"🇩🇪",England:"🏴",Spain:"🇪🇸",Italy:"🇮🇹",France:"🇫🇷",Argentina:"🇦🇷",Brazil:"🇧🇷",Portugal:"🇵🇹","South Africa":"🇿🇦",Kenya:"🇰🇪",Uganda:"🇺🇬",Egypt:"🇪🇬","Saudi Arabia":"🇸🇦","Saudi-Arabia":"🇸🇦",International:"🌍"};
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function isoDate(offset){const d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function toggleSearch(){document.getElementById("searchWrap").classList.toggle("hidden");document.getElementById("searchInput").focus();}
function clearSearch(){document.getElementById("searchInput").value="";document.getElementById("searchResults").innerHTML="";render(allMatches);}
function status(m){
 const s=String(m.status||"").toUpperCase();
 if(["1H","2H","ET","P","LIVE"].includes(s)) return m.live_verified && Number.isFinite(Number(m.elapsed)) ? `🔴 ${m.elapsed}'` : "🔴 LIVE — verified data only";
 if(s==="HT") return "🟡 HT";
 if(["FT","AET","PEN"].includes(s)) return "✅ FT";
 const d=new Date(m.date); return Number.isNaN(d.getTime())?"TBA":d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
}
function group(matches){
 const map=new Map();
 matches.forEach(m=>{const c=m.country||"International";const k=`${c}|${m.league_id}`;if(!map.has(k))map.set(k,{country:c,name:m.league_name||"Football",logo:m.league_logo,matches:[]});map.get(k).matches.push(m);});
 return [...map.values()];
}
function render(matches){
 const root=document.getElementById("matches");document.getElementById("count").textContent=`${matches.length} matches`;
 if(!matches.length){root.innerHTML='<div class="empty">No matches found.</div>';return;}
 root.innerHTML="";
 const countries={};
 group(matches).forEach(g=>{if(!countries[g.country])countries[g.country]=[];countries[g.country].push(g);});
 Object.entries(countries).forEach(([country,leagues])=>{
   const cs=document.createElement("section");cs.className="country";
   cs.innerHTML=`<div class="country-title"><span>${flags[country]||"🌍"}</span><b>${esc(country)}</b><i></i><em>${leagues.reduce((n,x)=>n+x.matches.length,0)}</em></div>`;
   leagues.forEach(l=>{
     const box=document.createElement("div");box.className="league";
     box.innerHTML=`<div class="league-head"><div>${l.logo?`<img src="${esc(l.logo)}">`:"🏆"}<span><b>${esc(l.name)}</b><small>${esc(country)}</small></span></div><b>⌃</b></div>`;
     l.matches.forEach(m=>{
       const live=["1H","2H","ET","P","LIVE","HT"].includes(String(m.status||"").toUpperCase());
       const score=(m.home_goals!=null&&m.away_goals!=null)?`${m.home_goals} — ${m.away_goals}`:"VS";
       const card=document.createElement("div");card.className="match";
       card.innerHTML=`<div class="team"><img src="${esc(m.home_logo)}"><b>${esc(m.home_team)}</b></div>
       <div class="mid"><span class="status ${live?"live":""}">${esc(status(m))}</span><strong>${esc(score)}</strong><button onclick="analyze(${m.fixture_id},this)">🔮 Analyze</button></div>
       <div class="team"><img src="${esc(m.away_logo)}"><b>${esc(m.away_team)}</b></div>`;
       box.appendChild(card);
     });cs.appendChild(box);
   });root.appendChild(cs);
 });
}
async function loadDay(offset){
 currentDay=offset;document.querySelectorAll(".tabs button").forEach((b,i)=>b.classList.toggle("active",i===offset+1));
 document.getElementById("pageTitle").textContent=offset===0?"Today's Matches":offset<0?"Yesterday's Matches":"Tomorrow's Matches";
 document.getElementById("matches").innerHTML='<div class="loader">Loading matches...</div>';document.getElementById("notice").innerHTML="";
 try{
   const r=await fetch(`/api/matches?date=${isoDate(offset)}&live=${offset===0?1:0}`,{cache:"no-store"});const d=await r.json();
   if(!r.ok||!d.success) throw Error(d.error||"Live data unavailable");
   allMatches=d.matches||[]; if(d.cached && !d.live_refresh) document.getElementById("notice").innerHTML='<div class="cache">● Cached data — live minute is not shown unless verified by the API.</div>';
   render(allMatches);
 }catch(e){document.getElementById("matches").innerHTML=`<div class="error"><b>Live data unavailable</b><p>${esc(e.message)}</p><small>Harmon Football Prediction will never invent a live minute or score.</small></div>`;}
}
async function analyze(id,btn){
 btn.disabled=true;btn.textContent="Analyzing...";
 try{const r=await fetch(`/api/analyze/${id}`);const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||"Analysis unavailable");showModal(d);}
 catch(e){
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal error-modal"><button class="close" onclick="closeModal()">×</button><div class="model">⚠️ Harmon Football Prediction</div><h3>Analysis temporarily limited</h3><p>${esc(e.message||"Prediction data unavailable")}</p><small>Harmon haitatengeneza score au live minute ya kubahatisha. Mfumo umetumia/utatumia historical cache inayoruhusiwa na API Free plan.</small></div></div>`;
}finally{btn.disabled=false;btn.textContent="🔮 Analyze";}
}
function showModal(d){
 const a=d.harmon_ai||{},m=d.match||{},h=d.home||{},v=d.away||{};
 const ou=a.over_under||{}, bt=a.btts||{}, dc=a.double_chance||{};
 const scores=Array.isArray(a.correct_score)?a.correct_score:[];
 const scoreHtml=scores.map(x=>`<span>${x.home_goals} — ${x.away_goals} <b>${x.probability}%</b></span>`).join('')||'<span>No correct-score data</span>';
 const hx=Number(a.home_xg||0.2), ax=Number(a.away_xg||0.15), total=hx+ax;
 const pois=(k,l)=>{let z=Math.exp(-l);for(let i=1;i<=k;i++)z*=l/i;return z};
 const ouP=(line,over)=>{let n=Math.floor(line),sum=0;for(let k=0;k<=n;k++)sum+=pois(k,total);return (over?1-sum:sum)*100};
 const bttsYes=bt.yes??(100*(1-Math.exp(-hx)-Math.exp(-ax)+Math.exp(-total)));
 const top=scores[0];
 const cleanHome=100*Math.exp(-ax), cleanAway=100*Math.exp(-hx);
 const oddEven=(()=>{let odd=0,even=0;for(let i=0;i<=10;i++){const q=pois(i,total);if(i%2)odd+=q;else even+=q}return [odd*100,even*100]})();
 document.getElementById("modalRoot").innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
 <button class="close" onclick="closeModal()">×</button>
 <div class="modal-teams"><div><img src="${esc(h.logo||m.home_logo)}"><b>${esc(h.name||m.home_team)}</b></div><span>VS</span><div><img src="${esc(v.logo||m.away_logo)}"><b>${esc(v.name||m.away_team)}</b></div></div>
 <div class="model">🤖 Harmon Football Prediction Statistical Engine</div>
 <div class="source">${d.live?"🟢 LIVE API VERIFIED":"🟡 CACHE / LIVE NOT VERIFIED"}${a.warning?` • ${esc(a.warning)}`:""}</div>
 <h3>🎯 Match Result Probability</h3><div class="prob"><div><span>Home Win</span><b>${a.home_probability??0}%</b></div><div><span>Draw</span><b>${a.draw_probability??0}%</b></div><div><span>Away Win</span><b>${a.away_probability??0}%</b></div></div>
 <div class="best"><small>Most likely result</small><b>${esc(a.predicted_result||"N/A")}</b><span>Confidence ${a.confidence??0}%</span></div>
 <h3>⚽ Expected Goals</h3><div class="prob"><div><span>Home</span><b>${a.home_xg??0}</b></div><div><span>Total</span><b>${a.expected_goals?.total??total.toFixed(2)}</b></div><div><span>Away</span><b>${a.away_xg??0}</b></div></div>
 <h3>📊 Over / Under</h3><div class="market"><span>Over 0.5 ${ou.over_0_5??ouP(.5,true).toFixed(1)}%</span><span>Over 1.5 ${ou.over_1_5??ouP(1.5,true).toFixed(1)}%</span><span>Over 2.5 ${ou.over_2_5??ouP(2.5,true).toFixed(1)}%</span><span>Over 3.5 ${ou.over_3_5??ouP(3.5,true).toFixed(1)}%</span><span>Under 1.5 ${ou.under_1_5??ouP(1.5,false).toFixed(1)}%</span><span>Under 2.5 ${ou.under_2_5??ouP(2.5,false).toFixed(1)}%</span><span>Under 3.5 ${ou.under_3_5??ouP(3.5,false).toFixed(1)}%</span></div>
 <h3>🔥 BTTS</h3><div class="market"><span>Yes ${Number(bttsYes).toFixed(1)}%</span><span>No ${(100-Number(bttsYes)).toFixed(1)}%</span></div>
 <h3>🔄 Double Chance</h3><div class="market"><span>1X ${dc['1X']??0}%</span><span>X2 ${dc.X2??0}%</span><span>12 ${dc['12']??0}%</span></div>
 <h3>🎯 Correct Score — Top 5</h3><div class="market">${scoreHtml}</div><div class="best"><small>Most likely correct score</small><b>${top?`${top.home_goals} — ${top.away_goals} • ${top.probability}%`:"N/A"}</b></div>
 <h3>🧤 Clean Sheet</h3><div class="market"><span>${esc(h.name||m.home_team)} ${cleanHome.toFixed(1)}%</span><span>${esc(v.name||m.away_team)} ${cleanAway.toFixed(1)}%</span></div>
 <h3>🕐 First Half Estimate</h3><div class="market"><span>Home ${Math.round(a.home_probability||0)}%</span><span>Draw ${Math.round(a.draw_probability||0)}%</span><span>Away ${Math.round(a.away_probability||0)}%</span><span>Over 0.5 ${(100*(1-Math.exp(-total*.45))).toFixed(1)}%</span></div>
 <h3>📈 Goal Distribution</h3><div class="market"><span>Odd ${oddEven[0].toFixed(1)}%</span><span>Even ${oddEven[1].toFixed(1)}%</span><span>4+ ${Math.max(0,100-[0,1,2,3].reduce((z,k)=>z+pois(k,total)*100,0)).toFixed(1)}%</span></div>
 <h3>📊 Recent Form</h3><div class="market"><span>${esc(h.name||m.home_team)} ${esc(a.home_form?.form_string||"N/A")}</span><span>${esc(v.name||m.away_team)} ${esc(a.away_form?.form_string||"N/A")}</span></div>
 <div class="best"><small>Model confidence</small><b>${a.confidence??0}%</b><span>Data quality ${a.data_quality??0}%</span></div>
 <div class="source">Statistical estimates only — not bookmaker odds and not a guarantee of result.</div>
 </div></div>`;
}
function closeModal(){document.getElementById("modalRoot").innerHTML="";}
function nav(name){if(name!=="Matches") alert(`${name} module iko tayari kwa hatua inayofuata.`);}
document.getElementById("searchInput").addEventListener("input",e=>{clearTimeout(searchTimer);const q=e.target.value.trim();if(q.length<2){document.getElementById("searchResults").innerHTML="";return;}searchTimer=setTimeout(async()=>{try{const r=await fetch(`/api/team-search?q=${encodeURIComponent(q)}`);const d=await r.json();document.getElementById("searchResults").innerHTML=(d.teams||[]).map(t=>`<button onclick="openTeam(${t.id},'${esc(t.name)}')"><img src="${esc(t.logo)}"><b>${esc(t.name)}</b></button>`).join("")||"<p>No team found</p>"}catch{}},400);});
async function openTeam(id,name){document.getElementById("searchResults").innerHTML="";document.getElementById("pageTitle").textContent=name;document.getElementById("matches").innerHTML='<div class="loader">Loading team...</div>';try{const r=await fetch(`/api/team/${id}/upcoming?next=10`);const d=await r.json();if(!r.ok||!d.success)throw Error(d.error);allMatches=d.matches||[];render(allMatches)}catch(e){document.getElementById("matches").innerHTML=`<div class="error">${esc(e.message)}</div>`;}}
loadDay(0);
</script>
</body></html>
